name: logobert
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.9
  - git
  - ninja

  - pytorch>=2.3,<2.6
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1

  - ipykernel
  - pip

  - pip:
      - transformers==4.49.0
      - tokenizers==0.21.0
      - accelerate==1.8.1
      - sentencepiece==0.1.99
      - pandas==2.2.2
      - numpy==1.26.4
      - scipy==1.11.4
      - scikit-learn==1.3.2
      - matplotlib==3.8.4
      - tqdm==4.67.1
      - datasets==2.19.0
      - huggingface-hub==0.27.1
      - requests==2.32.3
      - wandb==0.17.0
      - biopython==1.84
      - sentence-transformers==3.2.1
